openapi: 3.0.3
info:
  title: MAIS Management System API
  description: >-
    Complete API specification for the MAIS University Management System.
    This document covers all available endpoints including authentication,
    user management, courses, grades, schedules, and more.
    
    
    **Quick Start:**
    1. Use `POST /auth/login` to get JWT token
    2. Add `Authorization: Bearer <token>` header to all requests
    3. See Swagger UI at http://localhost:5000/swagger for interactive docs
    
    
    **Test Accounts:**
    - Teacher: `marek.horvath@university.edu` / `teacher123`
    - Student: `kyrylo.bulyk@student.university.edu` / `student123`
  version: 1.0.0
  contact:
    name: MAIS Development Team
  license:
    name: MIT
servers:
  - url: http://localhost:5000/api
    description: ASP.NET dev server (this repo)
  - url: http://localhost:5179/api
    description: Local development server (ASP.NET default suggested)
  - url: http://localhost:8080/api
    description: Local development server (Spring Boot)
security:
  - bearerAuth: []

tags:
  - name: Authentication
    description: Login, logout, token refresh, password reset
  - name: Profile
    description: Current user profile
  - name: Students
    description: Student management
  - name: Faculty
    description: Faculty/teacher management
  - name: Courses
    description: Course management
  - name: Schedule
    description: Timetable and schedule events
  - name: Gradebook
    description: Grades and assignments
  - name: Attendance
    description: Attendance tracking
  - name: Surveys
    description: Course feedback surveys
  - name: Chat
    description: Messaging system
  - name: Rooms
    description: Room management
  - name: Equipment
    description: Equipment management
  - name: News
    description: News and announcements
  - name: Exams
    description: Exam registration
  - name: Thesis
    description: Thesis topics and supervision
  - name: Payments
    description: Payment management
  - name: ClassGroups
    description: Class group management
  - name: KnowledgeBase
    description: Knowledge base articles
  - name: Activities
    description: Activity tracking
  - name: Database
    description: Database administration

paths:
  # ============ DATABASE MANAGEMENT ============
  /db/summary:
    get:
      tags: [Database]
      summary: Database summary and connectivity
      operationId: db_summary
      responses:
        '200':
          description: Summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DbSummary'
  /db/reseed:
    post:
      tags: [Database]
      summary: Reseed database from JSON seeds
      operationId: db_reseed
      parameters:
        - in: query
          name: reset
          schema: { type: boolean, default: false }
          description: When true, clears all tables before seeding
      responses:
        '200':
          description: Resulting summary after reseed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DbSummary'
  /db/clear:
    post:
      tags: [Database]
      summary: Clear specific database tables
      operationId: db_clear
      parameters:
        - in: query
          name: schedules
          schema: { type: boolean, default: false }
          description: Clear timetable entries
        - in: query
          name: enrollments
          schema: { type: boolean, default: false }
          description: Clear student enrollments
        - in: query
          name: exams
          schema: { type: boolean, default: false }
          description: Clear exam terms and registrations
        - in: query
          name: grades
          schema: { type: boolean, default: false }
          description: Clear course grades
        - in: query
          name: thesis
          schema: { type: boolean, default: false }
          description: Clear thesis topics, requests, and supervisions
      responses:
        '200':
          description: Tables cleared
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DbSummary'
  /db/upgrade/students:
    post:
      tags: [Database]
      summary: Upgrade students table schema
      operationId: db_upgrade_students
      description: >-
        Add new profile columns to Students table if they don't exist.
        Adds fields like Phone, Address, IsicCardNumber, BirthDate, PersonId, IsArchived, etc.
      responses:
        '200':
          description: Schema upgraded
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
        '500':
          description: Upgrade failed
  /db/sync-courses-faculty-program:
    post:
      tags: [Database]
      summary: Sync faculty and program to courses
      operationId: db_sync_courses
      description: >-
        Syncs Faculty and Program fields from teacher profiles to courses that don't have them.
        Looks up teachers assigned to courses via timetable entries.
      responses:
        '200':
          description: Sync completed
          content:
            application/json:
              schema:
                type: object
                properties:
                  updated: { type: integer }
                  total: { type: integer }
                  message: { type: string }
  /db/fix-course-types:
    post:
      tags: [Database]
      summary: Fix course TypeSk values
      operationId: db_fix_course_types
      description: >-
        Normalizes TypeSk values in courses table.
        Converts various formats to standard 'P+CL' or 'S'.
      responses:
        '200':
          description: Types fixed
          content:
            application/json:
              schema:
                type: object
                properties:
                  fixedCount: { type: integer }
                  total: { type: integer }
                  message: { type: string }

  # ============ AUTHENTICATION ============
  /auth/login:
    post:
      tags: [Authentication]
      summary: Sign in with email and password
      operationId: auth_login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Invalid credentials
  /auth/refresh:
    post:
      tags: [Authentication]
      summary: Refresh access token
      operationId: auth_refresh
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Token refreshed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Invalid or expired refresh token
  /auth/logout:
    post:
      tags: [Authentication]
      summary: Invalidate current refresh token (server-side logout)
      operationId: auth_logout
      responses:
        '204':
          description: Logged out
  /auth/session:
    get:
      tags: [Authentication]
      summary: Get current session info
      operationId: auth_session
      responses:
        '200':
          description: Session info
  /auth/forgot-password/request:
    post:
      tags: [Authentication]
      summary: Request password reset
      operationId: auth_forgot_password_request
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '200':
          description: Reset request sent
  /auth/forgot-password/resend:
    post:
      tags: [Authentication]
      summary: Resend password reset code
      operationId: auth_forgot_password_resend
      security: []
      responses:
        '200':
          description: Code resent
  /auth/forgot-password/verify-token:
    post:
      tags: [Authentication]
      summary: Verify reset token
      operationId: auth_forgot_password_verify_token
      security: []
      responses:
        '200':
          description: Token valid
  /auth/forgot-password/verify-code:
    post:
      tags: [Authentication]
      summary: Verify 6-digit reset code
      operationId: auth_forgot_password_verify_code
      security: []
      responses:
        '200':
          description: Code valid
  /auth/forgot-password/reset:
    post:
      tags: [Authentication]
      summary: Reset password with token
      operationId: auth_forgot_password_reset
      security: []
      responses:
        '200':
          description: Password reset successful

  # ============ PROFILE & USERS ============

  # ============ PROFILE & USERS ============
  /me:
    get:
      tags: [Profile]
      summary: Get current user's profile summary
      operationId: me_get
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
    put:
      tags: [Profile]
      summary: Update current user's profile
      operationId: me_update
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserProfileUpdate'
      responses:
        '200':
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
  /studies/me:
    get:
      tags: [Profile]
      summary: Get study info for current user
      operationId: studies_me
      responses:
        '200':
          description: Study info
  /users/change-password:
    post:
      tags: [Profile]
      summary: Change user password
      operationId: users_change_password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword: { type: string }
                newPassword: { type: string }
      responses:
        '200':
          description: Password changed
  /users/password-status:
    get:
      tags: [Profile]
      summary: Check if password change is required
      operationId: users_password_status
      responses:
        '200':
          description: Password status

  /users/{email}/temporary-password:
    get:
      summary: Get temporary password for a newly created user (teachers only)
      operationId: users_get_temporary_password
      description: >-
        Returns the temporary password for a user that was just created.
        The temporary password is cleared after the first successful login.
        Only accessible by teachers for administrative purposes.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: email
          required: true
          schema: { type: string, format: email }
          description: User email address
      responses:
        '200':
          description: Temporary password retrieved successfully
          content:
            application/json:
              schema:
                type: object
                required: [email, role, temporaryPassword, createdAt, message]
                properties:
                  email:
                    type: string
                    format: email
                    description: User email address
                  role:
                    type: string
                    enum: [student, teacher]
                    description: User role
                  fullName:
                    type: string
                    nullable: true
                    description: User full name (if available)
                  temporaryPassword:
                    type: string
                    description: Plain text temporary password
                  createdAt:
                    type: string
                    format: date-time
                    description: When the credential was created
                  message:
                    type: string
                    description: Additional information about password availability
        '400':
          description: Email is required
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '401':
          description: Unauthorized - requires teacher role
        '404':
          description: User not found or temporary password not available
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
  /user-preferences:
    get:
      tags: [Profile]
      summary: Get user preferences
      operationId: user_preferences_get
      responses:
        '200':
          description: User preferences
    put:
      tags: [Profile]
      summary: Update user preferences
      operationId: user_preferences_update
      responses:
        '200':
          description: Preferences updated
  /user-preferences/{key}:
    delete:
      tags: [Profile]
      summary: Delete preference by key
      operationId: user_preferences_delete
      parameters:
        - in: path
          name: key
          required: true
          schema: { type: string }
      responses:
        '204':
          description: Preference deleted

  # ============ STUDENTS ============

  # ============ STUDENTS ============
  /students:
    get:
      tags: [Students]
      summary: List students
      operationId: students_list
      parameters:
        - in: query
          name: q
          schema: { type: string }
          description: Free-text search (name, email)
        - in: query
          name: faculty
          schema: { type: string }
        - in: query
          name: program
          schema: { type: string }
        - in: query
          name: year
          schema: { type: integer }
        - in: query
          name: page
          schema: { type: integer, minimum: 1 }
          description: Page number (1-based). When provided with pageSize, the response is paged and X-Total-Count header is set.
        - in: query
          name: pageSize
          schema: { type: integer, minimum: 1, maximum: 200 }
          description: Page size.
        - in: query
          name: sort
          schema: { type: string, enum: [fullName, email, studyYear, id] }
          description: Sort key (defaults to fullName)
        - in: query
          name: order
          schema: { type: string, enum: [asc, desc] }
          description: Sort order (defaults to asc)
      responses:
        '200':
          description: Student list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Student' }
    post:
      tags: [Students]
      summary: Create student
      operationId: students_create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudentCreate'
      responses:
        '201':
          description: Student created
  /students/{id}:
    get:
      tags: [Students]
      summary: Get student by id
      operationId: students_get
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Student
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Student'
        '404': { description: Not found }
    put:
      tags: [Students]
      summary: Update student
      operationId: students_update
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Student updated
    delete:
      tags: [Students]
      summary: Delete student
      operationId: students_delete
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '204':
          description: Student deleted
  /students/{id}/profile:
    put:
      tags: [Students]
      summary: Update student profile
      operationId: students_update_profile
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Profile updated
  /students/{id}/graduation-status:
    put:
      tags: [Students]
      summary: Update student graduation status
      operationId: students_graduation_status
      description: Update graduation tracking information for a student (thesis, exams, etc.)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                thesisStatus: { type: string }
                thesisDefenseDate: { type: string, format: date-time, nullable: true }
                thesisGrade: { type: string, nullable: true }
                stateExamStatus: { type: string }
                stateExamDate: { type: string, format: date-time, nullable: true }
                stateExamGrade: { type: string, nullable: true }
                expectedGraduationDate: { type: string, format: date-time, nullable: true }
                actualGraduationDate: { type: string, format: date-time, nullable: true }
                diplomaNumber: { type: string, nullable: true }
      responses:
        '200':
          description: Graduation status updated
        '404':
          description: Student not found
  /students/by-email/{email}:
    get:
      tags: [Students]
      summary: Get student by email
      operationId: students_get_by_email
      parameters:
        - in: path
          name: email
          required: true
          schema: { type: string, format: email }
      responses:
        '200':
          description: Student
  /students/batch:
    put:
      tags: [Students]
      summary: Batch update students
      operationId: students_batch_update
      responses:
        '200':
          description: Students updated
  /students/{id}/enrollments:
    get:
      tags: [Students]
      summary: Get student enrollments
      operationId: students_enrollments
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Enrollments
  /students/{id}/grades:
    get:
      tags: [Students]
      summary: Get all student grades
      operationId: students_grades
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Grades

  # ============ FACULTY ============

  # ============ FACULTY ============
  /faculty:
    get:
      tags: [Faculty]
      summary: List faculty members
      operationId: faculty_list
      parameters:
        - in: query
          name: q
          schema: { type: string }
          description: Free-text search (name, email)
        - in: query
          name: page
          schema: { type: integer, minimum: 1 }
        - in: query
          name: pageSize
          schema: { type: integer, minimum: 1, maximum: 200 }
        - in: query
          name: sort
          schema: { type: string, enum: [fullName, email, rating, id] }
        - in: query
          name: order
          schema: { type: string, enum: [asc, desc] }
      responses:
        '200':
          description: Faculty list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Faculty' }
    post:
      tags: [Faculty]
      summary: Create faculty member
      operationId: faculty_create
      responses:
        '201':
          description: Faculty created
  /faculty/{id}:
    get:
      tags: [Faculty]
      summary: Get faculty member by id
      operationId: faculty_get
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Faculty member
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Faculty'
        '404': { description: Not found }
    put:
      tags: [Faculty]
      summary: Update faculty member
      operationId: faculty_update
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Faculty updated
    delete:
      tags: [Faculty]
      summary: Delete faculty member
      operationId: faculty_delete
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '204':
          description: Faculty deleted
  /faculty/by-email/{email}:
    get:
      tags: [Faculty]
      summary: Get faculty by email
      operationId: faculty_get_by_email
      parameters:
        - in: path
          name: email
          required: true
          schema: { type: string, format: email }
      responses:
        '200':
          description: Faculty member
  /faculty/{email}/profile:
    put:
      tags: [Faculty]
      summary: Update faculty profile
      operationId: faculty_update_profile
      parameters:
        - in: path
          name: email
          required: true
          schema: { type: string, format: email }
      responses:
        '200':
          description: Profile updated
  /faculty/{teacherId}/rating:
    get:
      tags: [Faculty]
      summary: Get teacher rating statistics
      operationId: faculty_rating_get
      parameters:
        - in: path
          name: teacherId
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Rating statistics
    post:
      tags: [Faculty]
      summary: Submit/update teacher rating
      operationId: faculty_rating_submit
      parameters:
        - in: path
          name: teacherId
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Rating submitted
  /faculty/{teacherId}/rating/student/{studentId}:
    get:
      tags: [Faculty]
      summary: Get student's rating for teacher
      operationId: faculty_rating_student
      parameters:
        - in: path
          name: teacherId
          required: true
          schema: { type: string }
        - in: path
          name: studentId
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Student rating
  /faculty/{teacherId}/ratings:
    get:
      tags: [Faculty]
      summary: Get all ratings for teacher (paginated)
      operationId: faculty_ratings_list
      parameters:
        - in: path
          name: teacherId
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Ratings list
  /faculty/{teacherId}/rating/{ratingId}:
    delete:
      tags: [Faculty]
      summary: Delete a rating
      operationId: faculty_rating_delete
      parameters:
        - in: path
          name: teacherId
          required: true
          schema: { type: string }
        - in: path
          name: ratingId
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Rating deleted
        '404':
          description: Rating not found

  # ============ COURSES ============

  # ============ COURSES ============
  /courses:
    get:
      tags: [Courses]
      summary: List courses
      operationId: courses_list
      parameters:
        - in: query
          name: q
          schema: { type: string }
          description: Free-text search (code or names)
        - in: query
          name: page
          schema: { type: integer, minimum: 1 }
        - in: query
          name: pageSize
          schema: { type: integer, minimum: 1, maximum: 200 }
        - in: query
          name: sort
          schema: { type: string, enum: [name, code, credits] }
        - in: query
          name: order
          schema: { type: string, enum: [asc, desc] }
      responses:
        '200':
          description: Course list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Course' }
  /courses/{code}:
    get:
      tags: [Courses]
      summary: Get course by code
      operationId: courses_get
      parameters:
        - in: path
          name: code
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Course
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Course'
        '404': { description: Not found }
  /courses/manage:
    get:
      tags: [Courses]
      summary: List courses with filtering (management)
      operationId: courses_manage_list
      responses:
        '200':
          description: Course list
    post:
      tags: [Courses]
      summary: Create course
      operationId: courses_manage_create
      responses:
        '201':
          description: Course created
  /courses/manage/{code}:
    put:
      tags: [Courses]
      summary: Update course
      operationId: courses_manage_update
      parameters:
        - in: path
          name: code
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Course updated
    delete:
      tags: [Courses]
      summary: Delete course
      operationId: courses_manage_delete
      parameters:
        - in: path
          name: code
          required: true
          schema: { type: string }
      responses:
        '204':
          description: Course deleted
  /courses/manage/faculties/distinct:
    get:
      tags: [Courses]
      summary: Get distinct faculties from courses
      operationId: courses_faculties_distinct
      description: Returns a list of unique faculty names from all courses
      responses:
        '200':
          description: List of distinct faculties
          content:
            application/json:
              schema:
                type: array
                items: { type: string }
  /courses/manage/programs/distinct:
    get:
      tags: [Courses]
      summary: Get distinct programs from courses
      operationId: courses_programs_distinct
      description: Returns a list of unique program names from all courses, optionally filtered by faculty
      parameters:
        - in: query
          name: faculty
          schema: { type: string }
          description: Filter programs by faculty
      responses:
        '200':
          description: List of distinct programs
          content:
            application/json:
              schema:
                type: array
                items: { type: string }
  /courses/{code}/enrollment-readiness:
    get:
      tags: [Courses]
      summary: Check course enrollment readiness
      operationId: courses_enrollment_readiness
      description: >-
        Check if a course is ready for student enrollment.
        Returns schedule events, class groups, and enrollment statistics.
      parameters:
        - in: path
          name: code
          required: true
          schema: { type: string }
          description: Course code
      responses:
        '200':
          description: Enrollment readiness information
          content:
            application/json:
              schema:
                type: object
                properties:
                  courseCode: { type: string }
                  courseName: { type: string }
                  hasScheduleEvents: { type: boolean }
                  scheduleEventCount: { type: integer }
                  hasClassGroups: { type: boolean }
                  classGroupCount: { type: integer }
                  enrollmentCount: { type: integer }
                  events:
                    type: array
                    items:
                      type: object
