      summary: Get activation token (dev helper)
      operationId: activation_token
      parameters:
        - in: query
          name: email
          schema: { type: string, format: email }
        - in: query
          name: scope
          schema: { type: string, enum: [faculty, student] }
      responses:
        '200':
          description: Activation token
  /auth/forgot-password/tokens:
    get:
      tags: [Authentication]
      summary: Get password reset tokens (dev helper)
      operationId: forgot_password_tokens
      parameters:
        - in: query
          name: email
          required: true
          schema: { type: string, format: email }
      responses:
        '200':
          description: Reset tokens

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    DbSummary:
      type: object
      properties:
        canConnect: { type: boolean }
        courses: { type: integer }
        faculty: { type: integer }
        students: { type: integer }
        rooms: { type: integer }
        equipment: { type: integer }
        timetable: { type: integer }
    Role:
      type: string
      enum: [teacher, student]

    User:
      type: object
      required: [id, email, role, fullName]
      properties:
        id: { type: string }
        email: { type: string, format: email }
        role: { $ref: '#/components/schemas/Role' }
        fullName: { type: string }

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password }
    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: { type: string }
    LoginResponse:
      type: object
      required: [accessToken, refreshToken, user]
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        user: { $ref: '#/components/schemas/User' }

    UserProfile:
      type: object
      description: Generic profile shape for current user
      properties:
        user: { $ref: '#/components/schemas/User' }
        faculty: { type: string, nullable: true }
        program: { type: string, nullable: true }
        degree: { type: string, nullable: true }
        studyYear: { type: integer, nullable: true }
        phone: { type: string, nullable: true }
        office: { type: string, nullable: true }
        officeHours: { $ref: '#/components/schemas/OfficeHours' }
        workingHours: { $ref: '#/components/schemas/WorkingHours' }
        departments:
          type: array
          items: { type: string }
        subjects:
          type: array
          items: { type: string }
        rating: { type: number, format: float, nullable: true }
        certifications:
          type: array
          items: { $ref: '#/components/schemas/Certification' }
    UserProfileUpdate:
      type: object
      properties:
        fullName: { type: string }
        phone: { type: string }
        office: { type: string }
        officeHours: { $ref: '#/components/schemas/OfficeHours' }
        workingHours: { $ref: '#/components/schemas/WorkingHours' }

    Student:
      type: object
      required: [id, fullName, email]
      properties:
        id: { type: string }
        fullName: { type: string }
        degree: { type: string, nullable: true }
        givenName: { type: string, nullable: true }
        familyName: { type: string, nullable: true }
        email: { type: string, format: email }
        faculty: { type: string }
        program: { type: string }
        studyYear: { type: integer }
        enrollmentSemester: { type: string, nullable: true }
        isArchived: { type: boolean, nullable: true }

    StudentCreate:
      type: object
      required: [fullName, email, faculty, program, studyYear]
      properties:
        fullName: { type: string }
        givenName: { type: string, nullable: true }
        familyName: { type: string, nullable: true }
        email: { type: string, format: email }
        faculty: { type: string }
        program: { type: string }
        degree: { type: string, nullable: true }
        studyYear: { type: integer }

    Faculty:
      type: object
      required: [id, fullName, email]
      properties:
        id: { type: string }
        fullName: { type: string }
        titlesPrefix:
          type: array
          items: { type: string }
        titlesSuffix:
          type: array
          items: { type: string }
        givenName: { type: string, nullable: true }
        familyName: { type: string, nullable: true }
        faculty: { type: string }
        departments:
          type: array
          items: { type: string }
        primaryDepartment: { type: string, nullable: true }
        email: { type: string, format: email }
        phone: { type: string, nullable: true }
        office: { type: string, nullable: true }
        status: { type: string, enum: [active, on-leave], nullable: true }
        employmentType: { type: string, enum: [full-time, part-time], nullable: true }
        classesCount: { type: integer, nullable: true }
        yearsExperience: { type: integer, nullable: true }
        hireDate: { type: string, format: date-time, nullable: true }
        lastActivity: { type: string, format: date-time, nullable: true }
        rating: { type: number, format: float, nullable: true }
        subjects:
          type: array
          items: { type: string }
        certifications:
          type: array
          items: { $ref: '#/components/schemas/Certification' }
        officeHours: { $ref: '#/components/schemas/OfficeHours' }
        workingHours: { $ref: '#/components/schemas/WorkingHours' }

    Certification:
      type: object
      properties:
        title: { type: string }
        issuer: { type: string }
        issuedOn: { type: string, format: date-time, nullable: true }
        expiresOn: { type: string, format: date-time, nullable: true }
        fileUrl: { type: string, nullable: true }
        fileName: { type: string, nullable: true }
        mimeType: { type: string, nullable: true }
        tags:
          type: array
          items: { type: string }
        code: { type: string, nullable: true }
        primary: { type: boolean, nullable: true }
        notes: { type: string, nullable: true }

    OfficeHours:
      type: object
      description: Weekday map of availability windows
      additionalProperties:
        $ref: '#/components/schemas/OfficeDayWindow'
    OfficeDayWindow:
      type: object
      properties:
        enabled: { type: boolean }
        start: { type: string, example: '10:00' }
        end: { type: string, example: '12:00' }

    WorkingHours:
      type: object
      description: Weekday map of working windows
      additionalProperties:
        $ref: '#/components/schemas/OfficeDayWindow'

    Course:
      type: object
      required: [code, nameEn, credits]
      properties:
        id: { type: string }
        code: { type: string }
        nameSk: { type: string, nullable: true }
        nameEn: { type: string }
        completionSk: { type: string, nullable: true }
        credits: { type: integer }
        typeSk: { type: string, nullable: true }
        profile: { type: string, nullable: true }
        hoursSk: { type: string, nullable: true }
        periodSk: { type: string, nullable: true }

    TimetableEntry:
      type: object
      properties:
        day: { type: string, example: 'Monday' }
        slot: { type: string, example: '09:10-09:55' }
        courseCode: { type: string }
        room: { type: string }
        teacherEmail: { type: string, format: email }
        note: { type: string, nullable: true }
        type: { type: string, nullable: true }

    ScheduleEvent:
      type: object
      properties:
        id: { type: string }
        subject: { type: string }
        courseCode: { type: string }
        teacher: { type: string }
        teacherEmail: { type: string, format: email, nullable: true }
        room: { type: string }
        day: { type: string }
        time: { type: string }
        endTime: { type: string }
        studentCount: { type: integer, nullable: true }
        hasConflict: { type: boolean, nullable: true }
        notes: { type: string, nullable: true }
        classGroupKeys:
          type: array
          items: { type: string }

    Class:
      type: object
      properties:
        id: { type: string }
        code: { type: string }
        name: { type: string }
        subject: { type: string }
        grade: { type: string, nullable: true }
        students: { type: integer }
        ownerId: { type: string }
        sessionsCount: { type: integer }
        sessions:
          type: array
          items:
            type: object
            properties:
              day: { type: string }
              time: { type: string }
              room: { type: string }

    Assignment:
      type: object
      properties:
        id: { type: string }
        classId: { type: string }
        name: { type: string }
        category: { type: string, enum: [quiz, homework, test, project] }
        totalPoints: { type: integer }
        dueDate: { type: string, format: date }
        description: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    GradeRecord:
      type: object
      properties:
        studentId: { type: string }
        assignmentId: { type: string }
        points: { type: integer }
        percentage: { type: integer }
        letterGrade: { type: string, enum: [A, B, C, D, F] }
        lastUpdated: { type: string, format: date-time }

    TeacherGradebook:
      type: object
      properties:
        teacher: { $ref: '#/components/schemas/Faculty' }
        classes:
          type: array
          items: { $ref: '#/components/schemas/Class' }
        classStudents:
          type: array
          items:
            type: object
            properties:
              classId: { type: string }
              students:
                type: array
                items: { $ref: '#/components/schemas/Student' }
        assignments:
          type: array
          items: { $ref: '#/components/schemas/Assignment' }
        grades:
          type: array
          items: { $ref: '#/components/schemas/GradeRecord' }

    StudentGradebook:
      type: object
      properties:
        student: { $ref: '#/components/schemas/Student' }
        classes:
          type: array
          items: { $ref: '#/components/schemas/Class' }
        assignments:
          type: array
          items: { $ref: '#/components/schemas/Assignment' }
        grades:
          type: array
          items: { $ref: '#/components/schemas/GradeRecord' }

    Room:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        type: { type: string }
        capacity: { type: integer, nullable: true }
        link: { type: string, nullable: true }
        email: { type: string, format: email, nullable: true }

    Equipment:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        type: { type: string }
        status: { type: string, enum: [available, in-use, maintenance] }
        location: { type: string }
        assignedTo: { type: string, nullable: true }
        nextBooking: { type: string, nullable: true }
