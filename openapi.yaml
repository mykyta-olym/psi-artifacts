  # ============ SCHEDULE ============
  /teachers/{email}/courses:
    get:
      tags: [Courses]
      summary: Get courses taught by a teacher
      operationId: teacher_courses
      description: >-
        Returns all courses that a teacher teaches based on their timetable entries
        and faculty subjects. Courses are extracted from schedule events and faculty profile.
      parameters:
        - in: path
          name: email
          required: true
          schema: { type: string, format: email }
          description: Teacher email address
      responses:
        '200':
          description: List of courses
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Course' }

  /teachers/{email}/courses/{code}/roster:
    get:
      tags: [Gradebook]
      summary: Get course roster (enrolled students)
      operationId: teacher_course_roster
      description: >-
        Returns the roster (list of enrolled students) for a specific course taught by a teacher.
        Includes schedule entries and student details.
      parameters:
        - in: path
          name: email
          required: true
          schema: { type: string, format: email }
          description: Teacher email address
        - in: path
          name: code
          required: true
          schema: { type: string }
          description: Course code
      responses:
        '200':
          description: Course roster
          content:
            application/json:
              schema:
                type: object
                properties:
                  entries:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        courseCode: { type: string }
                        day: { type: string }
                        slot: { type: string }
                        room: { type: string }
                        type: { type: string }
                        groupKeys: { type: string }
                  roster:
                    type: array
                    items:
                      type: object
                      properties:
                        studentId: { type: string }
                        personId: { type: string }
                        studentEmail: { type: string, format: email }
                        studentName: { type: string }
                        courseCode: { type: string }
                        scheduleEventId: { type: string }
                        groupKey: { type: string, nullable: true }
        '400':
          description: Missing course code

  /teachers/{email}/timetable:
    get:
      tags: [Schedule]
      summary: Teacher timetable entries
      operationId: teacher_timetable
      parameters:
        - in: path
