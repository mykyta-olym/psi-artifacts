<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Mais 2.0</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#111827" />
  <meta name="description" content="Mais 2.0 — modern academic suite" />
  <link rel="icon" type="image/svg+xml" href="https://api.iconify.design/mdi/owl.svg" />
  <script defer type="module" src="https://static.rocket.new/rocket-web.js?_cfg=https%3A%2F%2Fschoolsync5818back.builtwithrocket.new&_be=https%3A%2F%2Fapplication.rocket.new&_v=0.1.8"></script>
</head>
<body>
<noscript>You need to enable JavaScript to run this app.</noscript>

<div class="bg-stage" aria-hidden="true">
  <div class="bg-image"></div>
  <div class="clouds-bg"></div>
  <div class="vignette"></div>
</div>

<div class="dhiwise-code" id="root"></div>
<script type="module" src="/src/index.jsx"></script>

<script>
  (() => {
    const prefersReduce = window.matchMedia?.('(prefers-reduced-motion: reduce)').matches;
    if (prefersReduce) return;
    const prime = document.querySelectorAll('#root main, #root .glass-card, #root .bg-card, #root .card, #root header, #root nav');
    prime.forEach((el, i) => {
      el.classList.add('reveal');
      el.style.animationDelay = `${Math.min(i * 60, 600)}ms`;
    });
    const io = new IntersectionObserver((entries) => {
      entries.forEach(e => {
        if (e.isIntersecting) {
          e.target.classList.add('reveal-in');
          io.unobserve(e.target);
        }
      });
    }, { rootMargin: '0px 0px -10% 0px', threshold: 0.1 });
    document.querySelectorAll('.reveal, [data-reveal]').forEach(el => io.observe(el));
    document.querySelectorAll('[data-stagger]').forEach((wrap) => {
      const step = Number(wrap.getAttribute('data-stagger')) || 80;
      Array.from(wrap.children).forEach((child, idx) => {
        child.classList.add('stagger-child');
        child.style.animationDelay = `${idx * step}ms`;
      });
    });
  })();
</script>
</body>
</html>
